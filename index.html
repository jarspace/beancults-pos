<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>beancults POS</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#23473d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon.svg">

<style>
:root{--bg:#f1f4ef;--ink:#1b2a25;--card:#fff;--g:#23473d;--on:#fff;--a:#d9902f;--mut:#68776f;--ln:#d9e0db;--red:#b3402f}
@media(prefers-color-scheme:dark){:root{--bg:#121a17;--ink:#e8eee9;--card:#1c2622;--g:#7fc0a8;--on:#10201a;--a:#e8a94a;--mut:#93a29b;--ln:#2b3933;--red:#e57a68}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Bricolage Grotesque',system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

main{padding:12px;max-width:1100px;margin:auto}
button,input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;margin:3px 0}

.row{display:flex;gap:6px}.row>*{flex:1}.row2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.row2 .row{flex:0 0 auto}

.bd{background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:5px}.pr2{background:var(--a);color:#1b1206;padding:7px 14px;font-size:13px;cursor:pointer}

.brand{text-align:center;padding:40px 0 20px}.bw{font-size:42px;font-weight:800;letter-spacing:-1px;color:var(--g)}.bw span{font-weight:400;font-size:17px;letter-spacing:.3em;margin-left:8px;color:var(--a)}.bl{width:44px;height:2px;background:var(--a);margin:12px auto}.bt{letter-spacing:.4em;font-size:12px;color:var(--mut)}

</style></head><body><div id="app"></div><dialog id="dg"></dialog><div id="t"></div><div id="rc"></div>
<script>
// ====== Koneksi Supabase diisi lewat aplikasi (tombol Koneksi Supabase), tidak perlu edit kode ======
const APP_VER='2026.10.24-c';
(()=>{const m=location.hash.match(/^#c=([a-z0-9-]+)\.(.+)$/);if(m){localStorage.setItem('bc_cfg',JSON.stringify({url:'https://'+m[1]+'.supabase.co',key:m[2]}));history.replaceState(null,'',location.pathname+location.search)}})();
// Isi bawaan koneksi (opsional). Dipakai jika config.json dan pengisian manual tidak ada.
const CFG_DEFAULT={url:'',key:''};
const CFG=(()=>{let c=null;try{const x=new XMLHttpRequest();x.open('GET','config.json',false);x.send();
 if(x.status===200){const j=JSON.parse(x.responseText);if(/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(j.url||'')&&(j.key||'').length>20){c={url:j.url,key:j.key};localStorage.setItem('bc_cfgf',JSON.stringify(c))}}
 else if(x.status===404)localStorage.removeItem('bc_cfgf')}catch(e){}
 return c||JSON.parse(localStorage.getItem('bc_cfgf')||'null')||JSON.parse(localStorage.getItem('bc_cfg')||'null')||CFG_DEFAULT})();
const sb=(CFG.url&&window.supabase)?window.supabase.createClient(CFG.url,CFG.key):null;
const sb2=sb&&window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'bc_sb2'}}),AE='@beancults.app',PW=p=>p+'-bc';
const T=['items','customers','employees','orders'],PAY=['Tunai','QRIS','Transfer','Debit'],TYPES=['Dine-in','Takeaway','Delivery'];
const $=s=>document.querySelector(s),DG=$('#dg');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID(),rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID'),fd=d=>new Date(d).toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'});
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let S=JSON.parse(localStorage.getItem('bc_db')||'null')||{items:[],customers:[],employees:[],orders:[],last:{}};
let U=JSON.parse(localStorage.getItem('bc_u')||'null'),tab='kasir',cart=newCart(),busy=0,E;
const SID=localStorage.bc_sid||(localStorage.bc_sid=uid());
const save=()=>localStorage.setItem('bc_db',JSON.stringify(S)),live=t=>S[t].filter(r=>!r.deleted&&!r.cfg&&!r.tp),cfg=()=>S.items.find(x=>x.cfg&&!x.deleted)||{};
const tot=ls=>ls.reduce((s,l)=>s+l.price*l.qty,0);
function newCart(){return{lines:[],cust:'',phone:'',note:'',pay:'Tunai',type:'Dine-in'}}
function toast(m){const e=$('#t');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function modal(h){DG.innerHTML=h;DG.showModal()}
function put(t,r){r.updated_at=new Date().toISOString();r._d=1;const i=S[t].findIndex(x=>x.id===r.id);i<0?S[t].push(r):S[t][i]=r;save();render();sync()}
function del(t,id){const r=S[t].find(x=>x.id===id);if(r){r.deleted=true;put(t,r)}}
// ====== SYNC (id UUID dari klien = tidak ada data ganda; terbaru menang) ======
let again=0,rt=null,lastErr='',ownerExists=null;
function checkOwner(){if(!sb||!navigator.onLine)return;sb.rpc('has_owner').then(x=>{ownerExists=x.error?null:x.data;if(!U)render()})}
async function sync(){if(!sb||!navigator.onLine)return;if(busy){again=1;return}busy=1;setSt('sync');let ch=0;
 try{const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error('Belum login ke Supabase. Keluar lalu masuk lagi saat online.');lastErr='';for(const t of T){const d=S[t].filter(r=>r._d);
  if(d.length){const rows=d.map(({id,updated_at,deleted,_d,...data})=>({id,data,updated_at,deleted:!!deleted}));
   const{error}=await sb.from(t).upsert(rows);if(error)throw error;d.forEach(r=>{if(S[t].includes(r))delete r._d})}
  const{data,error}=await sb.from(t).select('*').gte('updated_at',S.last[t]||'1970-01-01').order('updated_at');if(error)throw error;
  for(const x of data){S.last[t]=x.updated_at;const l=S[t].find(r=>r.id===x.id);if(l&&(l._d||l.updated_at===x.updated_at))continue;const n={...x.data,id:x.id,updated_at:x.updated_at,deleted:x.deleted};l?S[t][S[t].indexOf(l)]=n:S[t].push(n);ch++}}
  save()}catch(e){console.warn(e);lastErr=(e.message||String(e))+(e.details?' | '+e.details:'')+(e.hint?' | '+e.hint:'')}
 busy=0;setSt();if(again){again=0;sync()}if(ch&&!DG.open&&!document.activeElement.matches('input,textarea'))render()}
function setSt(s){const e=$('#st');if(!e)return;const n=T.reduce((a,t)=>a+S[t].filter(r=>r._d).length,0),on=navigator.onLine;e.className=on?'on':'off';
 e.textContent=!on?'Offline'+(n?`, ${n} menunggu sinkron`:''):s==='sync'?'Sinkronisasi…':n?`Online, ${n} menunggu${lastErr?' (gagal, ketuk)':''}`:sb?'Online, tersinkron':'Online, mode lokal'}
async function claim(){if(!sb)return 1;const{data,error}=await sb.from('sessions').select('sid').gt('last_seen',new Date(Date.now()-9e4).toISOString()).neq('sid',SID);
 if(error)return 1;if(data.length>=5)return 0;await sb.from('sessions').upsert({sid:SID,uid:U?.id||'',last_seen:new Date().toISOString()});return 1}
setInterval(hb,10000);setInterval(()=>{if(tab==='info'&&U)loadSess()},10000);
function startRT(){if(!sb||rt)return;rt=sb.channel('bc-live');T.forEach(t=>rt.on('postgres_changes',{event:'*',schema:'public',table:t},()=>sync()));rt.subscribe(st=>{if(st==='SUBSCRIBED')sync()})}
setInterval(sync,10000);
addEventListener('online',()=>{setSt();sync()});addEventListener('offline',()=>setSt());
// ====== AUTH ======
async function setup(e){e.preventDefault();const f=new FormData(e.target),u=f.get('u').toLowerCase().trim(),h=await sha(f.get('p'));
 if(sb){if(!navigator.onLine)return toast('Perlu internet untuk membuat akun pertama');const r=await sb.auth.signUp({email:u+AE,password:PW(f.get('p'))});if(r.error)return toast(r.error.message);
  if(!r.data.session){const x=await sb.auth.signInWithPassword({email:u+AE,password:PW(f.get('p'))});if(x.error)return toast('Matikan "Confirm email" di Supabase Auth')}}
 put('employees',{id:uid(),name:f.get('n'),user:u,pin:h,role:'owner',salary:0})}
async function login(e){e.preventDefault();const f=new FormData(e.target),u=f.get('u').toLowerCase().trim(),pw=f.get('p'),h=await sha(pw);
 let m=live('employees').find(x=>x.user===u&&x.pin===h);
 if(sb&&navigator.onLine){const cr={email:u+AE,password:PW(pw)};let r=await sb.auth.signInWithPassword(cr);
  if(r.error&&m){await sb.auth.signUp(cr);r=await sb.auth.signInWithPassword(cr)}
  if(r.error)return toast('Username atau PIN salah');
  await sync();m=live('employees').find(x=>x.user===u);if(!m)return toast('Akun belum terdaftar sebagai karyawan');
  if(!await claim())return toast('Maksimal 5 pengguna aktif bersamaan')}
 else if(!m)return toast('Username atau PIN salah');
 U={id:m.id,name:m.name,role:m.role};localStorage.setItem('bc_u',JSON.stringify(U));tab='kasir';render();startRT()}
function out(){if(rt){sb.removeChannel(rt);rt=null}if(sb)sb.from('sessions').delete().eq('sid',SID).then(()=>sb.auth.signOut());U=null;localStorage.removeItem('bc_u');render()}
const go=t=>{tab=t;render();if(t==='info')loadSess()};
// ====== KASIR ======
let catF='';const cats=()=>[...new Set(live('items').map(i=>i.c).filter(Boolean))].sort();
const chips=()=>`<button class="${catF?'':'on'}" onclick="setCat(-1)">Semua</button>`+cats().map((c,k)=>`<button class="${c===catF?'on':''}" onclick="setCat(${k})">${esc(c)}</button>`).join('');
function setCat(k){catF=k<0?'':cats()[k];$('#chips').innerHTML=chips();$('#mg').innerHTML=mh($('#qs').value)}
function vKasir(){return`<div class="card row2"><small>${myShift()?'Kasir dibuka '+fd(myShift().openAt)+', modal awal '+rp(myShift().openCash):'Kasir belum dibuka (opsional)'}</small><button onclick="shiftForm()">${myShift()?'Tutup kasir':'Buka kasir'}</button></div><div class=sw id=sw></div><div class="pos" data-v="${kv}"><div id=mp><input id=qs placeholder="Cari menu" oninput="$('#mg').innerHTML=mh(this.value)"><div class=chips id=chips>${chips()}</div><button onclick="adhoc()" style="width:100%">+ Produk mendadak</button><div class="grid" id="mg">${mh('')}</div></div><div class="card" id="cartbox"></div></div>`}
function mh(q){const r=live('items').filter(i=>i.n.toLowerCase().includes(q.toLowerCase())&&(!catF||i.c===catF));return r.map(i=>`<button onclick="pick('${i.id}')"><b>${esc(i.n)}</b><small>${esc(i.c)}</small>${rp(i.p)}</button>`).join('')||'<p class="mut">Belum ada menu. Pemilik dapat menambah di tab Menu.</p>'}
const tops=()=>S.items.filter(x=>x.tp&&!x.deleted),itops=i=>[...(i.tids||[]).map(id=>S.items.find(x=>x.id===id&&!x.deleted)).filter(Boolean).map(x=>({n:x.n,p:x.p,m:x.m||0})),...(i.t||[])];
function pick(id){const i=S.items.find(x=>x.id===id),ts=itops(i);if(!i.v?.length&&!ts.length)return add(i,null,[]);
 modal(`<form onsubmit="pk(event,'${id}')"><h3>${esc(i.n)}</h3>${i.v?.length?'<b>Varian</b>'+i.v.map((v,k)=>`<label><input type=radio style="width:auto" name=v value=${k} ${k?'':'checked'}> ${esc(v.n)} +${rp(v.p)}</label>`).join(''):''}${ts.length?'<b>Topping</b>'+ts.map((t,k)=>`<label><input type=checkbox style="width:auto" name=t value=${k}> ${esc(t.n)} +${rp(t.p)}</label>`).join(''):''}<div class=row><button type=button onclick="DG.close()">Batal</button><button class=pri>Tambah</button></div></form>`)}
function pk(e,id){e.preventDefault();const i=S.items.find(x=>x.id===id),f=new FormData(e.target),v=f.get('v')!=null?i.v[+f.get('v')]:null,t=f.getAll('t').map(k=>itops(i)[+k]);DG.close();add(i,v,t)}
function add(i,v,t){const tn=t.map(x=>x.n),k=i.id+(v?v.n:'')+tn.join(),l=cart.lines.find(x=>x.k===k);l?l.qty++:cart.lines.push({k,n:i.n,v:v?v.n:'',tops:tn,price:i.p+(v?v.p:0)+t.reduce((s,x)=>s+x.p,0),cost:(i.m||0)+(v?v.m||0:0)+t.reduce((s,x)=>s+(x.m||0),0),qty:1});rc()}
function qty(i,d){cart.lines[i].qty+=d;if(cart.lines[i].qty<1)cart.lines.splice(i,1);rc()}
function cc(v){cart.cust=v;const c=live('customers').find(x=>x.n===v);if(c){cart.phone=c.phone||'';rc()}}
function cs(c){const os=live('orders').filter(o=>o.status==='paid'&&(o.cid===c.id||(!o.cid&&o.cust===c.n)));return{n:os.length,t:tot2(os),l:os.reduce((m,o)=>o.date>m?o.date:m,'')}}
const cst=c=>{const x=cs(c);return x.n+' kunjungan, '+rp(x.t)+(x.l?', terakhir '+fd(x.l):'')};
function custPick(){modal(`<h3>Pilih pelanggan</h3><input placeholder="Cari nama atau nomor" oninput="$('#cpl').innerHTML=cpl(this.value)"><div id=cpl style="max-height:50vh;overflow:auto">${cpl('')}</div><button onclick="DG.close()">Tutup</button>`)}
function cpl(q){q=q.toLowerCase();return live('customers').filter(c=>(c.n+' '+(c.phone||'')).toLowerCase().includes(q)).sort((a,b)=>a.n.localeCompare(b.n)).map(c=>`<button style="display:block;width:100%;text-align:left" onclick="setCust('${c.id}')"><b>${esc(c.n)}</b><small>${esc(c.phone)}</small><small>${cst(c)}</small></button>`).join('')||'<p class=mut>Belum ada pelanggan. Tambah di tab Pelanggan.</p>'}
function setCust(id){const c=S.customers.find(x=>x.id===id);cart.cust=c.n;cart.phone=c.phone||'';DG.close();rc()}
function rc(){const b=$('#cartbox');if(!b)return;b.innerHTML=`<h3>Pesanan${cart.no?' '+cart.no:''}</h3><div class=row><input placeholder="Nama pelanggan" value="${esc(cart.cust)}" oninput="cart.cust=this.value"><button onclick="custPick()" style="flex:0 0 auto">Pilih</button></div><input placeholder="WhatsApp (08…)" value="${esc(cart.phone)}" oninput="cart.phone=this.value">
${cart.lines.map((l,i)=>`<div class=ln><div><b>${esc(l.n)}</b> ${esc(l.v)}<small>${esc(l.tops.join(', '))}</small></div><div class=q><button onclick="qty(${i},-1)">−</button> ${l.qty} <button onclick="qty(${i},1)">+</button></div><span>${rp(l.price*l.qty)}</span></div>`).join('')||'<p class=mut>Pilih menu untuk memulai.</p>'}
<textarea placeholder="Keterangan (tampil di struk)" oninput="cart.note=this.value">${esc(cart.note)}</textarea><div class=row><select onchange="cart.type=this.value">${TYPES.map(t=>`<option ${t==cart.type?'selected':''}>${t}</option>`).join('')}</select><select onchange="cart.pay=this.value">${PAY.map(p=>`<option ${p==cart.pay?'selected':''}>${p}</option>`).join('')}</select></div><div class=row2><button onclick="discForm()">${cart.dc?'Diskon: '+esc(cart.dc.c)+' (ubah)':'+ Diskon / voucher'}</button></div>${cart.dc?`<div class=ln><span>Subtotal</span><span>${rp(tot(cart.lines))}</span></div><div class=ln><span>Diskon</span><span>-${rp(dAmt(cart.dc,tot(cart.lines)))}</span></div>`:''}<h2>${rp(ctot())}</h2>
<div class=row><button onclick="commit('held')">Tunda</button><button onclick="printOrder(mk('draft'))">Cetak sementara</button></div><button class=pri onclick="commit('paid')">Bayar &amp; cetak</button><button class=dng style="width:100%" onclick="cancelCart()">Batal pesanan</button>`;procUpd()}
function mk(status){return{id:cart.id||uid(),no:cart.no||'T'+Date.now().toString(36).slice(-5).toUpperCase(),date:cart.date||new Date().toISOString(),cashier:cart.cashier||U.name,lines:cart.lines,sub:tot(cart.lines),dc:cart.dc||null,disc:dAmt(cart.dc,tot(cart.lines)),total:ctot(),cust:cart.cust,phone:cart.phone,note:cart.note,pay:cart.pay,type:cart.type||'Dine-in',status}}
function commit(st){if(!cart.lines.length)return toast('Keranjang kosong');const o=mk(st);
 let c=o.cust&&live('customers').find(c=>c.n===o.cust);if(o.cust&&!c){c={id:uid(),n:o.cust,phone:o.phone,addr:''};put('customers',c)}if(c)o.cid=c.id;
 kv='menu';put('orders',o);if(st==='paid')printOrder(o);cart=newCart();rc();toast(st==='paid'?'Transaksi tersimpan':'Pesanan ditunda')}
function vTunda(){const h=live('orders').filter(o=>o.status==='held');return h.map(o=>`<div class="card row2"><div onclick="det('${o.id}')" style="cursor:pointer;flex:1"><b>${o.no}</b> ${esc(o.cust||'Tanpa nama')}<small>${o.lines.length} item, ${fd(o.date)}</small></div><b>${rp(o.total)}</b><div class=row><button onclick="resume('${o.id}')">Lanjutkan</button><button onclick="pr('${o.id}')">Cetak</button><button onclick="waHold('${o.id}')">WA</button><button class=dng onclick="delH('${o.id}')">Hapus</button></div></div>`).join('')||'<p class=mut>Tidak ada pesanan tertunda.</p>'}
function resume(id){const o=S.orders.find(x=>x.id===id);cart=JSON.parse(JSON.stringify(o));tab='kasir';kv='cart';render()}
function delH(id){if(confirm('Hapus pesanan tertunda?'))del('orders',id)}
