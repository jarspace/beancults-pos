const sb2=sb&&window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'bc_sb2'}}),AE='@beancults.app',PW=p=>p+'-bc';

const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

let S=window.__S0||JSON.parse(localStorage.getItem('bc_db')||'null')||{items:[],customers:[],employees:[],orders:[],last:{}},_sv=0,_mig=0;['items','customers','employees','orders'].forEach(k=>S[k]=S[k]||[]);S.last=S.last||{};
let U=JSON.parse(localStorage.getItem('bc_u')||'null'),tab='kasir',cart=newCart(),busy=0,E;
const SID=localStorage.bc_sid||(localStorage.bc_sid=uid());
const save=()=>saveS(),live=t=>S[t].filter(r=>!r.deleted&&!r.cfg&&!r.tp),cfg=()=>S.items.find(x=>x.cfg&&!x.deleted)||{};

function put(t,r){r.updated_at=new Date().toISOString();r._d=1;const i=S[t].findIndex(x=>x.id===r.id);i<0?S[t].push(r):S[t][i]=r;save();render();sync()}

// ====== SYNC (id UUID dari klien = tidak ada data ganda; terbaru menang) ======
let again=0,rt=null,lastErr='',ownerExists=null;
function checkOwner(){if(!sb||!navigator.onLine)return;sb.rpc('has_owner').then(x=>{ownerExists=x.error?null:x.data;if(!U)render()})}
async function sync(){if(!sb||!navigator.onLine||localStorage.getItem('bc_locked'))return;if(busy){again=1;return}busy=1;setSt('sync');let ch=0;
 try{let{data:{session}}=await sb.auth.getSession();if(!session){const rf=await sb.auth.refreshSession();session=rf.data&&rf.data.session}if(!session)throw new Error('Belum login ke Supabase. Ketuk indikator untuk menyambungkan ulang.');lastErr='';for(const t of T){const d=S[t].filter(r=>r._d);
  if(d.length){const rows=d.map(({id,updated_at,deleted,_d,...data})=>{if(t==='employees')delete data.pin;return{id,data,updated_at,deleted:!!deleted}});
   const{error}=await sb.from(t).upsert(rows);if(error)throw error;d.forEach(r=>{if(S[t].includes(r))delete r._d})}
  const{data,error}=await sb.from(t).select('*').gte('updated_at',S.last[t]||'1970-01-01').order('updated_at');if(error)throw error;
  for(const x of data){S.last[t]=x.updated_at;const l=S[t].find(r=>r.id===x.id);if(l&&(l._d||l.updated_at===x.updated_at))continue;const n={...x.data,id:x.id,updated_at:x.updated_at,deleted:x.deleted};if(t==='employees')delete n.pin;l?S[t][S[t].indexOf(l)]=n:S[t].push(n);ch++}}
  save()}catch(e){console.warn(e);lastErr=(e.message||String(e))+(e.details?' | '+e.details:'')+(e.hint?' | '+e.hint:'')}
 busy=0;setSt();if(LIC.url&&(cfg().lic||localStorage.getItem('bc_lic')||'')!==licLast)licCheck();if(again){again=0;sync()}if(ch&&!DG.open&&!document.activeElement.matches('input,textarea'))render()}
function setSt(s){synUpd();const e=$('#st');if(!e)return;const n=T.reduce((a,t)=>a+S[t].filter(r=>r._d).length,0),on=navigator.onLine;e.className=on?'on':'off';
 e.textContent=!on?'Offline'+(n?`, ${n} menunggu sinkron`:''):s==='sync'?'Sinkronisasi…':n?`Online, ${n} menunggu${lastErr?' (gagal, ketuk)':''}`:sb?'Online, tersinkron':'Online, mode lokal'}
async function claim(){if(!sb)return 1;const{data,error}=await sb.from('sessions').select('sid').gt('last_seen',new Date(Date.now()-9e4).toISOString()).neq('sid',SID);
 if(error)return 1;if(data.length>=5)return 0;await sb.from('sessions').upsert({sid:SID,uid:U?.id||'',last_seen:new Date().toISOString()});return 1}
setInterval(hb,10000);setInterval(()=>{if(tab==='info'&&U)loadSess()},10000);
function startRT(){if(!sb||rt)return;rt=sb.channel('bc-live');T.forEach(t=>rt.on('postgres_changes',{event:'*',schema:'public',table:t},()=>sync()));rt.subscribe(st=>{if(st==='SUBSCRIBED')sync()})}
setInterval(sync,10000);
addEventListener('online',()=>{setSt();sync()});addEventListener('offline',()=>setSt());
// ====== AUTH ======
async function setup(e){e.preventDefault();const f=new FormData(e.target),u=f.get('u').toLowerCase().trim(),pin=f.get('p'),id=uid();
 if(sb){if(!navigator.onLine)return toast('Perlu internet untuk membuat akun pertama');const r=await sb.auth.signUp({email:u+AE,password:PW(pin)});if(r.error)return toast(r.error.message);
  if(!r.data.session){const x=await sb.auth.signInWithPassword({email:u+AE,password:PW(pin)});if(x.error)return toast('Matikan "Confirm email" di Supabase Auth')}}
 put('employees',{id,name:f.get('n'),user:u,role:'owner',salary:0});await setPV(id,pin)}
function out(){if(rt){sb.removeChannel(rt);rt=null}if(sb)sb.from('sessions').delete().eq('sid',SID).then(()=>sb.auth.signOut({scope:'local'}));U=null;localStorage.removeItem('bc_u');render()}
const go=t=>{tab=t;render();if(t==='info')loadSess()};
// ====== KASIR ======
let catF='';const cats=()=>[...new Set(live('items').map(i=>i.c).filter(Boolean))].sort();
const chips=()=>`<button class="${catF?'':'on'}" onclick="setCat(-1)">Semua</button>`+cats().map((c,k)=>`<button class="${c===catF?'on':''}" onclick="setCat(${k})">${esc(c)}</button>`).join('');
function setCat(k){catF=k<0?'':cats()[k];kPg=0;$('#chips').innerHTML=chips();$('#mg').innerHTML=mh($('#qs').value);pgUpd()}
function vKasir(){return`<div class="card row2"><small>${myShift()?'Kasir dibuka '+fd(myShift().openAt)+', modal awal '+rp(myShift().openCash):'Kasir belum dibuka (opsional)'}</small><button onclick="shiftForm()">${myShift()?'Tutup kasir':'Buka kasir'}</button></div><div class=sw id=sw></div><div class="pos" data-v="${kv}"><div id=mp><input id=qs placeholder="Cari menu" oninput="kPg=0;$('#mg').innerHTML=mh(this.value);pgUpd()"><div class=chips id=chips>${chips()}</div><button onclick="adhoc()" style="width:100%">+ Produk mendadak</button><div class=row2 id=mpg></div><div class="grid" id="mg">${mh('')}</div></div><div class="card" id="cartbox"></div></div>`}
let kPg=0,kRows=+localStorage.getItem('bc_krows')||12,kMeta={t:0,n:1};
function mh(q){const SK=stocks(),all=live('items').filter(i=>i.n.toLowerCase().includes(q.toLowerCase())&&(!catF||i.c===catF)),n=kRows>0?Math.max(1,Math.ceil(all.length/kRows)):1;if(kPg>=n)kPg=n-1;if(kPg<0)kPg=0;kMeta={t:all.length,n};
 const r=kRows>0?all.slice(kPg*kRows,(kPg+1)*kRows):all;
 return r.map(i=>`<button onclick="pick('${i.id}')"><b>${esc(i.n)}</b><small>${esc(i.c)}</small>${rp(i.p)}${i.id in SK?`<small class="${SK[i.id]<=0||(i.smin!=null&&SK[i.id]<=i.smin)?'dn':''}">${SK[i.id]<=0?'Habis':'Sisa '+SK[i.id]}</small>`:''}</button>`).join('')||'<p class="mut">Belum ada menu. Pemilik dapat menambah di tab Kontrol Barang.</p>'}

const tops=()=>S.items.filter(x=>x.tp&&!x.deleted),itops=i=>[...(i.tids||[]).map(id=>S.items.find(x=>x.id===id&&!x.deleted)).filter(Boolean).map(x=>({n:x.n,p:x.p,m:x.m||0})),...(i.t||[])];
function pick(id){const i=S.items.find(x=>x.id===id),ts=itops(i);if(stocks()[i.id]<=0)return toast('Stok '+i.n+' habis');const pg=(i.pkg||[]).filter(x=>x.includes('/')),pf=(i.pkg||[]).filter(x=>!x.includes('/'));if(!i.v?.length&&!ts.length&&!pg.length)return add(i,null,[],pf);
 modal(`<form onsubmit="pk(event,'${id}')"><h3>${esc(i.n)}</h3>${i.v?.length?'<b>Varian</b>'+i.v.map((v,k)=>`<label><input type=radio style="width:auto" name=v value=${k} ${k?'':'checked'}> ${esc(v.n)} +${rp(v.p)}</label>`).join(''):''}${ts.length?'<b>Topping</b>'+ts.map((t,k)=>`<label><input type=checkbox style="width:auto" name=t value=${k}> ${esc(t.n)} +${rp(t.p)}</label>`).join(''):''}${pg.length?'<b>Pilihan paket</b>'+pg.map((x,gi)=>'<small>'+esc(x)+'</small>'+x.split('/').map(o=>o.trim()).map((o,oi)=>`<label><input type=radio style="width:auto" name=g${gi} value="${esc(o)}" ${oi?'':'checked'}> ${esc(o)}</label>`).join('')).join(''):''}${pf.length?'<small>Isi paket: '+esc(pf.join(', '))+'</small>':''}<div class=row><button type=button onclick="DG.close()">Batal</button><button class=pri>Tambah</button></div></form>`)}
function pk(e,id){e.preventDefault();const i=S.items.find(x=>x.id===id),f=new FormData(e.target),v=f.get('v')!=null?i.v[+f.get('v')]:null,t=f.getAll('t').map(k=>itops(i)[+k]);const pg=(i.pkg||[]).filter(x=>x.includes('/')),ch=[...(i.pkg||[]).filter(x=>!x.includes('/')),...pg.map((x,gi)=>f.get('g'+gi))];DG.close();add(i,v,t,ch)}
function add(i,v,t,ch){const sm=stocks();if(i.id in sm){const cur=cart.lines.filter(x=>idOf(x)===i.id).reduce((a,x)=>a+x.qty,0);if(cur+1>sm[i.id])return toast('Stok '+i.n+' tinggal '+Math.max(0,sm[i.id])+(cur?', sudah '+cur+' di keranjang':''))}const tn=t.map(x=>x.n),k=i.id+(v?v.n:'')+tn.join()+(ch||[]).join('|'),l=cart.lines.find(x=>x.k===k&&!x.note&&x.po==null);l?l.qty++:cart.lines.push({k,n:i.n,v:v?v.n:'',tops:tn,price:i.p+(v?v.p:0)+t.reduce((s,x)=>s+x.p,0),cost:(i.m||0)+(v?v.m||0:0)+t.reduce((s,x)=>s+(x.m||0),0),qty:1,pkl:ch&&ch.length?ch:undefined});rc()}
function qty(i,d){const ql=cart.lines[i];if(d>0){const sm=stocks(),id=idOf(ql);if(id in sm&&cart.lines.filter(x=>idOf(x)===id).reduce((a,x)=>a+x.qty,0)+d>sm[id])return toast('Stok '+ql.n+' tinggal '+Math.max(0,sm[id]))}cart.lines[i].qty+=d;if(cart.lines[i].qty<1)cart.lines.splice(i,1);rc()}

 if(f.get('t')==='in'){if(bal<=0){if(!confirm('Pelanggan tidak punya hutang. '+rp(amt)+' akan disimpan sebagai deposit. Lanjut?'))return}else if(amt>bal&&!confirm('Hutang '+rp(bal)+' dilunasi, kelebihan '+rp(amt-bal)+' menjadi deposit. Lanjut?'))return}
